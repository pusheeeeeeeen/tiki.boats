<!DOCTYPE html>
<html>
  <head>
    <meta charset = "utf-8">
    <script src = "../default-script.js"></script>
    <link href = "../default-styles.css" rel = "stylesheet" type = "text/css">
    <link href = "../page-styles.css" rel = "stylesheet" type = "text/css">
    <link rel = "preload" href = "../fonts/roboto.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "../fonts/roboto-bold.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "../fonts/roboto-italic.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "../fonts/roboto-bold-italic.ttf" as = "font" type = "font/ttf">
    <style>
      #click-and-drag {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        font-size: min(11vw, 20px);
        font-weight: bold;
        letter-spacing: 0.04em;
        opacity: 0.9;
        pointer-events: none;
      }
      #click-and-drag.hide {
        transition: opacity 1s linear, filter 1s ease-in, transform 1s var(--ease-in);
        opacity: 0;
        transform: translate(-50%, 50%);
        filter: blur(1em);
      }
    </style>
  </head>
  <body>
    <main class = "has-canvas">
      <canvas id = "canvas"></canvas>
      <div id = "click-and-drag">
        Click and drag...
      </div>
    </main>
  </body>
  <script src = "../helpers.js"></script>
  <script src = "script.js"></script>
</html>
