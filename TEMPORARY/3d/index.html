<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8">
    <title>Very cool game</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      
      #fps {
        position: absolute;
        top: 2px;
        left: 2px;
        pointer-events: none;
        color: #fffc;
        font-family: Menlo, monospace;
        font-size: 13px;
      }
      
      #loading-wrapper, #resume-wrapper {
        position: absolute;
        inset: 0;
        z-index: 100;
      }
      
      #loading-wrapper {
        background: radial-gradient(#262320 30%, #161310);
      }
      #loading-wrapper > div {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        color: white;
        text-shadow: 0 1px 10px white;
        font-family: sans-serif;
        pointer-events: none;
      }
      #click-to-start {
        opacity: 0;
      }
      #loading-wrapper.start > #loading-text {
        opacity: 0;
        transition: opacity 0.3s linear;
      }
      #loading-wrapper.start > #click-to-start {
        opacity: 1;
        transition: opacity 0.3s linear 0.3s;
      }
      #loading-wrapper.hide {
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s linear;
      }
      
      #resume-wrapper {
        background: #0006;
        display: none;
        place-items: center;
        white-space: nowrap;
        color: white;
        font-family: sans-serif;
      }
      #resume-wrapper.show {
        display: grid;
      }
    </style>
  </head>
  <body>
    <canvas id = "canvas"></canvas>
    <div id = "fps"></div>
    <div id = "loading-wrapper">
      <div id = "loading-text">
        Loading... <span id = "loading-percentage">0</span>%
      </div>
      <div id = "click-to-start">
        Click to start
      </div>
    </div>
    <div id = "resume-wrapper">
      Click to resume
    </div>
  </body>
  <script src = "gl-matrix.min.js"></script>
  <script src = "js/asset-loader.js"></script>
</html>
