<!DOCTYPE html>
<html>
  <head>
    <meta charset = "utf-8">
    <script src = "../default-script.js"></script>
    <link href = "../default-styles.css" rel = "stylesheet" type = "text/css">
    <link href = "../page-styles.css" rel = "stylesheet" type = "text/css">
    <link rel = "preload" href = "../fonts/roboto.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "../fonts/roboto-bold.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "../fonts/roboto-italic.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "../fonts/roboto-bold-italic.ttf" as = "font" type = "font/ttf">
    <!-- <link href = "style.css" rel = "stylesheet" type = "text/css"> -->
    <style>
      main {
        display: grid;
        place-items: center;
      }
      #ui {
        animation: spin 5s linear infinite, weight 4s ease-in-out infinite;
        font-family: var(--header-font);
      }

      @keyframes weight {
        from { font-weight: 100; }
        50% { font-weight: 900; }
        to { font-weight: 100; }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <main>
      <div id = "ui">ui coming soon</div>
    </main>
  </body>
  <script src = "tone.min.js"></script>
  <script src = "../helpers.js"></script>
  <script src = "keymaps.js"></script>
  <script src = "script.js"></script>
</html>
