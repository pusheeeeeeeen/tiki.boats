<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8">
    <link rel = "icon" href = "../assets/tiki-icon.png">
    <meta name = "viewport" content = "width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv = "X-UA-Compatible" content = "ie=edge">
    <title>Tiki</title>
    <link href = "./style.css" type = "text/css" rel = "stylesheet">
  </head>
  <body class = "light-theme">
    <div id = "wrapper">
      <main>
        <section id = "sec1">
          <div class = "fish-img-container">
            <img class = "fish-img" src = "../assets/tiki-fish.png">
          </div>
          <div id = "title" class = "title">
            <span>Tiki Games</span>
          </div>
          <div class = "fish-img-container">
            <img class = "fish-img" src = "../assets/tiki-fish.png">
          </div>
        </section>
        <section id = "sec2">
          <div class = "title">Finished Games</div>
          <a href = "./platformer/" class = "game" id = "game-platformer">
            <img class = "game-img" src = "../assets/tiki-platformer.png">
            <div class = "game-img-darken"></div>
            <div class = "game-title">Platformer</div>
          </a>
          <a href = "./dice/" class = "game" id = "game-dice">
            <img class = "game-img" id = "dice-img" src = "../assets/dice-game.png">
            <div class = "game-img-darken"></div>
            <div class = "game-title">32 Dice</div>
          </a>
        </section>
        <section id = "sec3">
          <div class = "title">Unfinished Games</div>
          <a href = "./bananagrams/" class = "game" id = "game-bananagrams">
            <img class = "game-img" src = "../assets/bananagrams.png">
            <div class = "game-img-darken"></div>
            <div class = "game-title">Bananagrams</div>
          </a>
        </section>
      </main>
    </div>
  </body>
  <script>var path = "../", title = "games"</script>
  <script src = "../helper-fns.js"></script>
  <script src = "../default-script.js"></script>
<!--   <script src = "./script.js"></script> -->
</html>
