<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8">
    <link rel = "icon" href = "../assets/tiki-icon.png">
    <meta name = "viewport" content = "width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv = "X-UA-Compatible" content = "ie=edge">
    <title>b o g p a d</title>
    <style>
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #101214 !important;
      }
      #img-wrapper {
        max-width: calc(100% - 30px);
        width: 600px;
        border: 4px outset var(--white);
        position: relative;
      }
      #bogpad {
        width: 100%;
        display: block;
      }
      #display {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: #202224;
      }

      .panel {
        transform: rotate3d(1, 0, 0, 180deg);
        backface-visibility: hidden;
      }
      .panel-active {
        transform: none;
      }

      .letter {
        outline: 1px solid transparent;
        font-family: var(--title-font);
      }
      #game .letter {
        outline: 1px solid #888;
        color: var(--text);
        cursor: grab;
      }
      #game .letter._dragging {
        cursor: grabbing;
      }
      #game .important {
        color: #888;
      }
      #display {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }
      #subtitle {
        text-align: center;
        padding: 0 30px;
      }
      #letter-boxes {
        display: flex;
        gap: 8px;
        justify-content: center;
        transition: gap 1s ease-in;
      }
      .letter-box {
        width: 30px;
        height: 50px;
        border: 1px solid var(--blue);
        transition: border-color 1s ease-in, font-weight 1s ease-in, text-shadow 1s ease-in;
      }
      .letter-box > .letter {
        outline: none !important;
        width: 100%;
        font-size: 26px;
        display: inline-block;
        text-align: center;
        position: relative;
        top: 50% !important;
        transform: translateY(-50%);
      }

      #time {
        font-weight: bold;
        font-size: 32px;
      }
      #time::before, #time::after {
        content: "·";
        color: var(--blue);
        margin: 0 8px;
      }

      #start-game {
        transition: opacity 1s ease-out;
      }
      main:not(#game) #start-game {
        opacity: 0.8;
        cursor: pointer;
      }
    </style>
    <link rel = "preload" href = "./bogpad.png" as = "image">
    <link rel = "preload" href = "./frogpad.png" as = "image">
    <link rel = "preload" href = "./eggpad.png" as = "image">
  </head>
  <body class = "light-theme">
    <div id = "wrapper">
      <main>
        <div id = "img-wrapper">
          <img id = "bogpad" class = "panel panel-active" src = "./bogpad.png">
          <div id = "display" class = "panel">
            <div id = "time"></div>
            <div id = "subtitle">
              Form a word by dragging the outlined letters below into the slots.
            </div>
            <div id = "letter-boxes">
              <div class = "letter-box" data-letter = "m"></div>
              <div class = "letter-box" data-letter = "a"></div>
              <div class = "letter-box" data-letter = "n"></div>
              <div class = "letter-box" data-letter = "a"></div>
              <div class = "letter-box" data-letter = "t"></div>
              <div class = "letter-box" data-letter = "e"></div>
              <div class = "letter-box" data-letter = "e"></div>
            </div>
          </div>
        </div>
        <div id = "message" class = "important">
          Congra<span class = "letter" data-letter = "t">t</span>ulations,
          tr<span class = "letter" data-letter = "a">a</span>veler,
          you have
          discover<span class = "letter" data-letter = "e">e</span>d
          a wild
          <i id = "img-name">bogpad</i>.
          <br>
          <br>
          Take a
          r<span class = "letter" data-letter = "e">e</span>st
          here,
          i<span class = "letter" data-letter = "n">n</span>
          the bog,
          a<span class = "letter" data-letter = "m">m</span>ongst
          the pad,
          <span class = "letter" data-letter = "a">a</span>nd
          enjoy yourself for a <span id = "start-game">minute</span>.
        </div>
      </main>
    </div>
  </body>
  <script>var path = "../", title = "b o g p a d", footer = false</script>
  <script src = "../helper-fns.js"></script>
  <script src = "../default-script.js"></script>
  <script src = "../secret.js"></script>
  <script>
    const images = ["bogpad", "frogpad", "eggpad"]
    
    var num = parseInt(new URLSearchParams(location.search).get("i") || "0")
    
    id("bogpad").onclick = () => {
      num = (num + 1) % 3

      updateImage()

      history.pushState({num}, "")
    }

    function updateImage() {
      bogpad.src = `./${images[num]}.png`
      id("img-name").text(images[num])

      unlockSecret(images[num][0].toUpperCase() + images[num].slice(1))

      var title = [...images[num]].join(" ")
      $("title").html(title)
      id("page-title").text(title)
    }

    updateImage()

    onpopstate = event => {
      num = event.state.num || 0

      updateImage()
    }
  </script>
  <script src = "./game.js"></script>
</html>
