<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8">
    <link rel = "icon" href = "./assets/tiki-icon.png">
    <meta name = "viewport" content = "width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv = "X-UA-Compatible" content = "ie=edge">
    <title>Tiki</title>
    <link href = "./style.css" type = "text/css" rel = "stylesheet">
  </head>
  <body class = "light-theme">
    <div id = "wrapper">
      <main>
        <section id = "sec1">
          <div id = "draggables"></div>
          <span id = "big-logo">TIKI</span>
          <span id = "subtitle">.boats</span>
        </section>
        <section id = "sec2">
          <span class = "title">Welcome to tiki.boats</span>
          <i>The home for a whole lot of random stuff and not that much else.</i>
        </section>
        <section id = "sec3" tabindex = "0">
          <img id = "platformer-img" src = "./assets/tiki-platformer.png" loading = "lazy">
          <div id = "platformer-img-darken"></div>
          <div id = "platformer-text">
            <div id = "platformer-title">Platformer</div>
            <div id = "platformer-subtitle">CLICK TO PLAY</div>
          </div>
        </section>
      </main>
      <div id = "black-overlay"></div>
    </div>
  </body>
  <script>var path = "./", title = ".boats"</script>
  <script src = "./helper-fns.js"></script>
  <script src = "./default-script.js"></script>
  <script src = "./script.js"></script>
