<!DOCTYPE html>
<html>
  <head>
    <meta charset = "utf-8">
    <link href = "/default-styles.css" rel = "stylesheet" type = "text/css">
    <link rel = "preload" href = "/fonts/roboto.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "/fonts/roboto-bold.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "/fonts/roboto-italic.ttf" as = "font" type = "font/ttf">
    <link rel = "preload" href = "/fonts/roboto-bold-italic.ttf" as = "font" type = "font/ttf">
    <title>404 – Tiki</title>
    <style>
      body {
        overflow: hidden;
      }
      main {
        display: grid;
        place-items: center;
        background: black;
      }
      #gradient, #particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #gradient {
        opacity: 0;
      }
      main.show #gradient {
        background: radial-gradient(var(--blue-dark), transparent);
        opacity: 1;
        transition: opacity 6s ease-out;
      }
      #logo {
        width: max-content;
        white-space: nowrap;
        font-size: min(250px, 30vw);
        font-weight: bold;
        opacity: 0;
        filter: blur(40px);
        transform: scale(0.8) translateY(20%);
        z-index: 1;
        position: relative;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      #logo-inner {
        text-shadow: 0 2px 10px white;
        filter: drop-shadow(-0.08em 0.08em 2px #0006);
      }
      #fish-wrapper {
        display: inline-block;
        height: 0.85em;
        position: relative;
        vertical-align: middle;
        transform: translateY(-0.05em);
      }
      #fish {
        height: 100%;
        filter: drop-shadow(0 2px 10px var(--blue));
        transform: translateY(-0.05em);
      }
      #fish-wrapper::before {
        content: "";
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid var(--text);
        filter: drop-shadow(0 2px 10px white);
      }
      main.show #logo {
        opacity: 1;
        transform: none;
        filter: none;
        transition: opacity 2s ease-in, filter 2.5s ease-out, transform 3s var(--ease-out);
      }
      main.show #fish-wrapper {
        margin: 0 0.1em;
        transition: margin 2s ease-out;
      }
      #subtext-wrapper {
        position: absolute;
        inset: 0;
      }
      #error, #return {
        position: absolute;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
        font-size: 15%;
        letter-spacing: 0.05em;
        opacity: 0;
      }
      main.show #error, main.show #return {
        opacity: 0.8;
        transform: translateX(-50%);
        transition: opacity 0.7s ease-in, transform 0.8s var(--ease-out);
      }
      #error {
        bottom: 105%;
        transition-delay: 1.7s, 1.7s !important;
      }
      #return {
        top: 110%;
        text-decoration: none;
        transition-delay: 2s, 2s !important;
      }
      #return:hover {
        color: var(--blue-light);
        text-decoration: underline;
      }
      #logo-inner, #subtext-wrapper {
        animation: float 8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      #subtext-wrapper {
        animation-delay: -1s;
      }
      @keyframes float {
        0%, 100% {
          transform: translateY(-2%);
        }
        50% {
          transform: translateY(2%);
        }
      }

      .splash {
        animation: splash-fade var(--dur) linear forwards,
          splash 4s linear forwards;
        position: absolute;
        transform: translate(-50%, -50%);
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(3px);
      }
      @keyframes splash-fade {
        to {
          opacity: 0;
        }
      }
      @keyframes splash {
        from {
          width: 0;
          border: 2px solid #fff2;
        }
        to {
          width: 260px;
          border: 4px solid #fff2;
        }
      }

      .falling-fish {
        position: absolute;
        opacity: 0.5;
        top: -100px;
        transition: top 1s linear, transform 0.25s ease-in-out;
      }
      .falling-fish.flip {
        transform: scaleX(-1);
      }
    </style>
  </head>
  <body>
    <main>
      <div id = "gradient"></div>
      <div id = "particles"></div>
      <div id = "logo">
        <div id = "logo-inner">
          4<div id = "fish-wrapper"><img id = "fish" src = "/images/tiki-fish.png"></div>4
        </div>
        <div id = "subtext-wrapper">
          <div id = "error">ERROR</div>
          <a id = "return" href = "/?p=home">→ RETURN HOME ←</a>
        </div>
      </div>
    </main>
  </body>
  <script src = "/helpers.js"></script>
  <script>
    if (id("fish").complete) {
      query("main").classList.add("show")
    } else {
      id("fish").onload = () => query("main").classList.add("show")
    }

    let canSplash = true

    onmousedown = e => {
      if (!canSplash) return

      canSplash = false
      setTimeout(() => canSplash = true, 250)

      let x = e.pageX, y = e.pageY

      for (let i = 0; i < 3; i++)
        setTimeout(() => splash(x, y, 1 - i / 3), i * 400)

      let flippedFish = queryAll(".falling-fish.flip"),
          notFlipped = queryAll(".falling-fish:not(.flip)")

      flippedFish.forEach(fish => fish.classList.remove("flip"))
      notFlipped.forEach(fish => fish.classList.add("flip"))
    }

    let canSplashMove = true

    onmousemove = e => {
      if (!canSplashMove) return

      canSplashMove = false
      setTimeout(() => canSplashMove = true, 150)

      splash(e.pageX, e.pageY, 0.5)
    }

    setInterval(() => {
      splash(Math.random() * innerWidth, Math.random() * innerHeight, Math.random() * 0.2 + 0.2)
    }, 300)

    function splash(x, y, strength) {
      let splash = createElem("div.splash")

      splash.style.left = `${x}px`
      splash.style.top = `${y}px`

      splash.style.opacity = strength

      splash.style.setProperty("--dur", `${strength * 4}s`)

      // void splash.offsetWidth

      id("particles").append(splash)

      setTimeout(() => splash.remove(), strength * 4000)
    }

    setTimeout(() => {
      let fallingFish = []

      setInterval(() => {
        fallingFish = fallingFish.filter(fish => {
          if (fish.offsetTop > innerHeight) {
            fish.remove()
            return false
          }

          fish.style.top = `${fish.offsetTop + 100}px`

          return true
        })

        if (Math.random() < 0.5) return

        let fish = createElem("img.falling-fish")

        fish.src = "/images/tiki-fish.png"

        let w = Math.random() * 50 + 50
        fish.style.width = `${w}px`
        fish.style.left = `${Math.random() * (innerWidth - w)}px`

        if (Math.random() < 0.5)
          fish.classList.add("flip")

        id("particles").append(fish)
        fallingFish.push(fish)
      }, 500)
    }, 10000)
  </script>
</html>
